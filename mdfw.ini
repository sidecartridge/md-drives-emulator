; EmuMD: this firmware's own C code built for the host and run in EmuMD's Hatari,
; with an emulated Multi-device on the cartridge port.
;
;   tools/dev/build_hatari_fork.sh     # once: EmuMD's Hatari
;   tools/dev/mdfw.sh build            # build/drives-emulator.mdfw
;   tools/dev/mdfw.sh run [--headless --frames N --screenshot out.png]

[firmware]
name = Drives Emulator
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
files =
    rp/src/*.c
    rp/src/settings/settings.c
    rp/src/u8g2/*.c
    emu/*.c
; Left out, with what the rest needs from them in emu/standins.c: u8g2's
; set-up of every physical display, the Wi-Fi and the LED (GCC nested
; functions, which clang rejects), USB mass storage (TinyUSB) and the SD
; card's hardware timeouts.
exclude =
    rp/src/u8g2/u8g2_d_setup.c
    rp/src/network.c
    rp/src/blink.c
    rp/src/usb_descriptors.c
    rp/src/usb_mass.c
    rp/src/sd_timeouts_config.c

[compile]
shims =
    emu/shim
include =
    rp/src
    rp/src/include
    rp/src/settings
    rp/src/u8g2
defines =
    _DEBUG=0
    RELEASE_TYPE="final"
    PICO_FLASH_ASSUME_CORE0_SAFE=1
    APP_DOWNLOAD_HTTPS=0
; Addresses are 64 bits on the host: a cast that cuts one must fail the build.
cflags = -O2 -include emu/prefix.h -Werror=pointer-to-int-cast -Werror=int-to-pointer-cast

[wifi]
arch = poll

[run]
sd = emu/sd
tos = emu/tos/tos104us.img
machine = st
